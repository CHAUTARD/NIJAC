; Configuration PHP spécifique au répertoire NIJAC
; Chargé par PHP-FPM / CGI (contrairement à .htaccess qui n'est lu que par mod_php)

output_buffering = 4096

; Pièces jointes EN15 (5 Mo/fichier, 8 Mo/message) et dépôts EN21/EN28 — mêmes valeurs que .htaccess
upload_max_filesize = 10M
post_max_size = 12M
